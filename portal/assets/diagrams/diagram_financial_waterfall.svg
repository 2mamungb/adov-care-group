<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="100%" height="auto" class="waterfall-bar-svg" style="max-width:100%; height:auto; display:block; background:#FFFFFF; border-radius:10px; border:1px solid #CBD5E1; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="barGross" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1E36" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="barPayroll" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="barLease" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="barOpex" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="barEbitda" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="barCashflow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <!-- Title Header Block -->
  <rect x="0" y="0" width="1060" height="64" fill="#0F1E36" rx="10 10 0 0" />
  <text x="32" y="32" fill="#38BDF8" font-size="12.5" font-weight="800" letter-spacing="1.2">AUDITED FINANCIAL PROPORTIONAL WATERFALL MODEL // RATIO-WISE BREAKDOWN</text>
  <text x="32" y="52" fill="#FFFFFF" font-size="15" font-weight="700">Gross Placement Revenue (£977,600) to Operating EBITDA (£341,392) &amp; Group Cashflow (£438,392)</text>
  <rect x="910" y="16" width="120" height="32" rx="4" fill="#2563EB" />
  <text x="970" y="37" fill="#FFFFFF" font-size="12.5" font-weight="800" text-anchor="middle">8 BEDS STABILIZED</text>

  <!-- Background grid lines for 0%, 25%, 50%, 75%, 100% -->
  <!-- Bar X starts at 380, width 520 (100% = 520px) -->
  <line x1="380" y1="80" x2="380" y2="530" stroke="#E2E8F0" stroke-width="1.2" />
  <line x1="510" y1="80" x2="510" y2="530" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="640" y1="80" x2="640" y2="530" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="770" y1="80" x2="770" y2="530" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="900" y1="80" x2="900" y2="530" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Percentage Scale Headers -->
  <text x="380" y="94" fill="#94A3B8" font-size="11" font-weight="700" text-anchor="middle">0%</text>
  <text x="510" y="94" fill="#94A3B8" font-size="11" font-weight="700" text-anchor="middle">25% (£244.4k)</text>
  <text x="640" y="94" fill="#94A3B8" font-size="11" font-weight="700" text-anchor="middle">50% (£488.8k)</text>
  <text x="770" y="94" fill="#94A3B8" font-size="11" font-weight="700" text-anchor="middle">75% (£733.2k)</text>
  <text x="900" y="94" fill="#64748B" font-size="11.5" font-weight="800" text-anchor="middle">100% (£977.6k)</text>

  <!-- ROW 1: GROSS REVENUE (100%) -->
  <text x="32" y="128" fill="#0F1E36" font-size="13.5" font-weight="800">1. Gross Placement Revenue</text>
  <text x="32" y="144" fill="#64748B" font-size="11">8 Beds @ £2,350/wk avg</text>
  <rect x="380" y="112" width="520" height="34" rx="4" fill="url(#barGross)" />
  <text x="912" y="134" fill="#0F1E36" font-size="13.5" font-weight="800">£977,600</text>
  <text x="990" y="134" fill="#2563EB" font-size="12" font-weight="700">(100.0%)</text>

  <!-- ROW 2: DIRECT CARE PAYROLL (36.3%) -->
  <!-- 36.32% of 520 = 188.9px -->
  <text x="32" y="180" fill="#0F1E36" font-size="13.5" font-weight="800">2. Direct Care Staffing Payroll</text>
  <text x="32" y="196" fill="#64748B" font-size="11">10.0 FTE, Autumn 2024 NI, Pension, SSP</text>
  <rect x="380" y="164" width="189" height="32" rx="4" fill="url(#barPayroll)" />
  <text x="580" y="185" fill="#DC2626" font-size="13" font-weight="800">-£355,108</text>
  <text x="655" y="185" fill="#991B1B" font-size="12" font-weight="700">(36.3%)</text>

  <!-- ROW 3: COMMERCIAL LEASES (9.9%) -->
  <!-- 9.92% of 520 = 51.6px -->
  <text x="32" y="232" fill="#0F1E36" font-size="13.5" font-weight="800">3. Commercial Property Leases</text>
  <text x="32" y="248" fill="#64748B" font-size="11">78 Gdns (£65k) + 80 Gdns (£32k) to PropCo</text>
  <rect x="380" y="216" width="52" height="30" rx="4" fill="url(#barLease)" />
  <text x="442" y="236" fill="#D97706" font-size="13" font-weight="800">-£97,000</text>
  <text x="515" y="236" fill="#B45309" font-size="12" font-weight="700">(9.9%)</text>

  <!-- ROW 4: UTILITIES & OVERHEADS (4.9%) -->
  <!-- 4.93% of 520 = 25.6px -->
  <text x="32" y="282" fill="#0F1E36" font-size="13.5" font-weight="700">4. Utilities, Fuel &amp; Overheads</text>
  <text x="32" y="298" fill="#64748B" font-size="11">Dual-fuel gas/elec, water, rates, HTM 07-01</text>
  <rect x="380" y="266" width="26" height="28" rx="3" fill="#64748B" />
  <text x="416" y="285" fill="#475569" font-size="12.5" font-weight="700">-£48,200</text>
  <text x="485" y="285" fill="#64748B" font-size="11.5">(4.9%)</text>

  <!-- ROW 5: PROVISIONS & RESIDENT CARE (2.5%) -->
  <!-- 2.54% of 520 = 13.2px -->
  <text x="32" y="330" fill="#0F1E36" font-size="13.5" font-weight="700">5. Provisions, Nutrition &amp; PPE</text>
  <text x="32" y="346" fill="#64748B" font-size="11">Wholefood nutrition £59.60/wk, COSHH</text>
  <rect x="380" y="314" width="14" height="28" rx="3" fill="#64748B" />
  <text x="404" y="333" fill="#475569" font-size="12.5" font-weight="700">-£24,800</text>
  <text x="473" y="333" fill="#64748B" font-size="11.5">(2.5%)</text>

  <!-- ROW 6: REGULATORY, DIGITAL & SINKING (11.4% Combined) -->
  <!-- 11.36% of 520 = 59.1px -->
  <text x="32" y="378" fill="#0F1E36" font-size="13.5" font-weight="700">6. Regulatory, Tech &amp; Sinking Fund</text>
  <text x="32" y="394" fill="#64748B" font-size="11">CQC fees, £10M Ins, e-MAR, £70k reserve</text>
  <rect x="380" y="362" width="60" height="28" rx="3" fill="#475569" />
  <text x="450" y="381" fill="#475569" font-size="12.5" font-weight="700">-£111,100</text>
  <text x="525" y="381" fill="#64748B" font-size="11.5">(11.4%)</text>

  <!-- DIVIDER LINE -->
  <line x1="32" y1="416" x2="1028" y2="416" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- ROW 7: OPERATING EBITDA (34.9% MARGIN) -->
  <!-- 34.92% of 520 = 181.6px -->
  <text x="32" y="446" fill="#065F46" font-size="14.5" font-weight="900">7. Operating EBITDA (OpCo Profit)</text>
  <text x="32" y="464" fill="#047857" font-size="11.5" font-weight="600">Net operating cash flow generated</text>
  <rect x="380" y="430" width="182" height="36" rx="4" fill="url(#barEbitda)" />
  <text x="572" y="454" fill="#047857" font-size="14.5" font-weight="900">+£341,392</text>
  <text x="668" y="454" fill="#065F46" font-size="13" font-weight="800">(34.9% Margin)</text>

  <!-- ROW 8: CONSOLIDATED GROUP CASHFLOW (44.8% OF GROSS) -->
  <!-- 44.84% of 520 = 233.2px -->
  <text x="32" y="498" fill="#92400E" font-size="14.5" font-weight="900">8. Consolidated Group Cash Flow</text>
  <text x="32" y="516" fill="#78350F" font-size="11.5" font-weight="600">OpCo EBITDA (£341.4k) + PropCo Rent (£97k)</text>
  <rect x="380" y="482" width="233" height="36" rx="4" fill="url(#barCashflow)" />
  <text x="625" y="506" fill="#B45309" font-size="14.5" font-weight="900">+£438,392</text>
  <text x="720" y="506" fill="#78350F" font-size="13" font-weight="800">(44.8% Retained)</text>

  <!-- SUMMARY FOOTER STRIP -->
  <rect x="0" y="550" width="1060" height="70" fill="#F8FAFC" rx="0 0 10 10" stroke="#CBD5E1" stroke-width="1" />
  <text x="32" y="574" fill="#0F1E36" font-size="12" font-weight="800">BOARDROOM RATIO VERDICT:</text>
  <text x="32" y="594" fill="#334155" font-size="12">
    • Direct Care Payroll is tightly controlled at <tspan font-weight="700" fill="#DC2626">36.3%</tspan> of Gross Turnover through shared campus rota efficiencies (vs. 50-60% industry average).
  </text>
  <text x="660" y="594" fill="#047857" font-size="12" font-weight="700">
    • Fixed Break-Even: 3.82 Beds (47.7% Occupancy) &bull; Margin of Safety: +52.3%
  </text>
</svg>