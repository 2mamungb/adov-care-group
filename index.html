<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=portal/index.html">
  <title>ADOV Care Group — Executive Management Portal Gateway</title>
  <script>window.location.href = "portal/index.html";</script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0A192F;
      color: #FFFFFF;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .wrap {
      max-width: 600px;
      background: #0F223D;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { margin-bottom: 8px; color: #FFFFFF; font-size: 24px; }
    p { color: #94A3B8; font-size: 14px; margin-bottom: 24px; }
    .btns { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-gold { background: #D97706; color: #FFFFFF; }
    .btn-gold:hover { background: #F59E0B; }
    .btn-outline { background: rgba(255, 255, 255, 0.08); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.15); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.15); }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>ADOV Care Group</h2>
    <p>Executive Decision Suite &amp; Planning Portal Gateway</p>
    <div class="btns">
      <a href="portal/index.html" class="btn btn-gold">Enter Executive Gateway &rarr;</a>
      <a href="portal/v2.html" class="btn btn-outline">Launch Version 2.0 (Apple Theme) &rarr;</a>
      <a href="portal/v1.html" class="btn btn-outline">Launch Version 1.0 (Classic MIS) &rarr;</a>
    </div>
  </div>
</body>
</html>
