<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <defs>
    <!-- Dark Slate Background -->
    <radialGradient id="backBg" cx="80%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Holographic Accent -->
    <linearGradient id="holoLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <!-- Platinum Text Fill -->
    <linearGradient id="platText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Background Surface -->
  <rect width="1050" height="600" rx="24" fill="url(#backBg)"/>

  <!-- 2. Subtle Precision Architectural Grid Lines -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.6">
    <!-- Horizontal Structural Dividers -->
    <line x1="60" y1="170" x2="990" y2="170"/>
    <line x1="60" y1="460" x2="990" y2="460"/>
    <!-- Vertical Divider between Info and QR/NFC -->
    <line x1="740" y1="60" x2="740" y2="540"/>
  </g>

  <!-- 3. Top Header: Mini Brand Monogram & Classification -->
  <g transform="translate(60, 85)">
    <!-- Mini Glyph -->
    <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="#0A0F1D" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#00F0FF"/>
    
    <text x="22" y="4" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="5">
      FAIRYTALES SMM
    </text>
    <text x="260" y="4" fill="#64748B" font-family="'Space Grotesk', monospace" font-size="10" letter-spacing="2">
      // EXECUTIVE GOVERNANCE
    </text>
  </g>

  <!-- 4. Executive Identity Area -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" fill="url(#platText)" font-family="'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="2">
      MAMUN ALAMGIR
    </text>
    
    <text x="0" y="32" fill="#00F0FF" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="4">
      CHIEF EXECUTIVE OFFICER &amp; MANAGING PARTNER
    </text>
    
    <text x="0" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="500" letter-spacing="2">
      Multi-Channel E-Commerce &amp; Social Commerce Acceleration
    </text>
  </g>

  <!-- Accent Gradient Accent Stripe Under Name -->
  <line x1="60" y1="325" x2="280" y2="325" stroke="url(#holoLine)" stroke-width="2.5" filter="url(#cyanGlow)"/>

  <!-- 5. Contact & Channel Coordinates -->
  <g transform="translate(60, 365)">
    <!-- Column 1: Direct Access -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" fill="#64748B" font-family="'Space Grotesk', monospace" font-size="9" letter-spacing="2">DIRECT COMMUNICATIONS</text>
      <text x="0" y="22" fill="#FFFFFF" font-family="'Space Grotesk', monospace" font-size="13" font-weight="600" letter-spacing="1">+44 (0) 7900 000 000</text>
      <text x="0" y="44" fill="#38BDF8" font-family="'Space Grotesk', monospace" font-size="13" font-weight="500">ceo@fairytalessmm.com</text>
    </g>

    <!-- Column 2: Digital Gateway & Distribution -->
    <g transform="translate(340, 0)">
      <text x="0" y="0" fill="#64748B" font-family="'Space Grotesk', monospace" font-size="9" letter-spacing="2">ENTERPRISE ECOSYSTEM</text>
      <text x="0" y="22" fill="#FFFFFF" font-family="'Space Grotesk', monospace" font-size="13" font-weight="600" letter-spacing="1">fairytalessmm.com</text>
      <text x="0" y="44" fill="#94A3B8" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="1">Amazon 1P/3P • TikTok Shop • B&amp;Q • Temu</text>
    </g>
  </g>

  <!-- 6. Bottom Coordinates Bar (Official Headquarters) -->
  <g transform="translate(60, 505)">
    <text x="0" y="0" fill="#64748B" font-family="'Space Grotesk', monospace" font-size="9" letter-spacing="2">HEADQUARTERS &amp; PRODUCTION CAMPUS</text>
    <text x="0" y="20" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">
      High Heath Farm, Whitwell Road, Codicote, Hertfordshire, SG4 8SZ, United Kingdom
    </text>
  </g>

  <!-- 7. Right Column: High-Tech NFC & Vector QR Code Hub -->
  <g transform="translate(770, 95)">
    <!-- NFC Contactless Symbol & Tag -->
    <g transform="translate(75, 45)">
      <!-- Animated Radio Arc Waves -->
      <path d="M -18 0 A 18 18 0 0 1 18 0" fill="none" stroke="#64748B" stroke-width="1.5"/>
      <path d="M -28 0 A 28 28 0 0 1 28 0" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
      <path d="M -38 0 A 38 38 0 0 1 38 0" fill="none" stroke="#00F0FF" stroke-width="2.2" filter="url(#cyanGlow)"/>
      <circle cx="0" cy="0" r="4" fill="#00F0FF"/>
      
      <text x="0" y="28" text-anchor="middle" fill="#00F0FF" font-family="'Space Grotesk', monospace" font-size="9" font-weight="700" letter-spacing="2">
        NFC INSTANT TAP
      </text>
    </g>

    <!-- Minimalist Vector QR Code Frame -->
    <g transform="translate(10, 190)">
      <!-- QR Background Plate -->
      <rect x="0" y="0" width="130" height="130" rx="10" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.2"/>
      
      <!-- Modern Styled Stylized QR Pattern -->
      <!-- Position Markers -->
      <!-- Top Left -->
      <rect x="12" y="12" width="30" height="30" rx="4" fill="none" stroke="#00F0FF" stroke-width="3"/>
      <rect x="20" y="20" width="14" height="14" rx="2" fill="#00F0FF"/>
      
      <!-- Top Right -->
      <rect x="88" y="12" width="30" height="30" rx="4" fill="none" stroke="#00F0FF" stroke-width="3"/>
      <rect x="96" y="20" width="14" height="14" rx="2" fill="#00F0FF"/>
      
      <!-- Bottom Left -->
      <rect x="12" y="88" width="30" height="30" rx="4" fill="none" stroke="#00F0FF" stroke-width="3"/>
      <rect x="20" y="96" width="14" height="14" rx="2" fill="#00F0FF"/>
      
      <!-- Internal Digital Data Cells -->
      <rect x="52" y="14" width="8" height="8" fill="#38BDF8"/>
      <rect x="68" y="24" width="8" height="8" fill="#38BDF8"/>
      <rect x="52" y="34" width="8" height="8" fill="#38BDF8"/>
      <rect x="14" y="54" width="8" height="8" fill="#38BDF8"/>
      <rect x="30" y="54" width="8" height="8" fill="#38BDF8"/>
      <rect x="52" y="54" width="24" height="24" rx="3" fill="url(#holoLine)"/>
      <rect x="86" y="54" width="8" height="8" fill="#38BDF8"/>
      <rect x="106" y="54" width="8" height="8" fill="#38BDF8"/>
      <rect x="52" y="88" width="8" height="8" fill="#38BDF8"/>
      <rect x="68" y="98" width="8" height="8" fill="#38BDF8"/>
      <rect x="88" y="88" width="8" height="8" fill="#38BDF8"/>
      <rect x="106" y="106" width="8" height="8" fill="#38BDF8"/>
    </g>

    <!-- Scan Label -->
    <text x="75" y="345" text-anchor="middle" fill="#64748B" font-family="'Space Grotesk', monospace" font-size="8.5" letter-spacing="2">
      SCAN // VIP ACCESS
    </text>

    <!-- Digital ID Code -->
    <text x="75" y="415" text-anchor="middle" fill="#334155" font-family="'Space Grotesk', monospace" font-size="8" letter-spacing="3">
      ID: FS-SG4-2026
    </text>
  </g>
</svg>
