<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 856" width="540" height="856">
  <defs>
    <!-- Background Gradient: Pure Porcelain / Titanium White -->
    <radialGradient id="wBackBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </radialGradient>

    <!-- Subtle Light Tech Grid Pattern -->
    <pattern id="wBackGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E2E8F0" stroke-width="0.5" opacity="0.6"/>
      <circle cx="0" cy="0" r="0.75" fill="#0284C7" opacity="0.25"/>
