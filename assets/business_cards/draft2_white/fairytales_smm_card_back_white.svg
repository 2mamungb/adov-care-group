  </defs>

  <!-- 1. Base Credit Card Surface (ISO/IEC 7810 ID-1: rx=32) -->
  <rect width="540" height="856" rx="32" fill="url(#wBackBg)"/>

  <!-- 2. Subtle Micro-Grid Overlay -->
  <rect x="18" y="18" width="504" height="820" rx="26" fill="url(#wBackGrid)"/>

